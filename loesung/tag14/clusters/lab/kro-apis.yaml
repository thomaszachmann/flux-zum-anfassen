---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kro-apis
  namespace: flux-system
spec:
  dependsOn:
  - name: kro
  interval: 1h0m0s
  path: ./infrastructure/kro-apis
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m0s
  wait: true
