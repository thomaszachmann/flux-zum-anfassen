apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notes-db-dev
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/notes-db/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  timeout: 2m0s
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notes-dev
  namespace: flux-system
spec:
  dependsOn:
  - name: notes-db-dev
  suspend: true
  interval: 5m0s
  path: ./apps/notes/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  timeout: 2m0s
  wait: true
  postBuild:
    substitute:
      NOTES_VERSION: 0.6.0-rc.4 # {"$imagepolicy": "flux-system:notes-api-rc:tag"}
    substituteFrom:
    - kind: ConfigMap
      name: cluster-vars
