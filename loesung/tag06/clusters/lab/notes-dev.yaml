---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notes-db-dev
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/notes-db/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m0s
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notes-dev
  namespace: flux-system
spec:
  dependsOn:
  - name: notes-db-dev
  interval: 5m0s
  path: ./apps/notes/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m0s
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
