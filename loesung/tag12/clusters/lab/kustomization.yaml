apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - alerts.yaml
  - cluster-vars.yaml
  - echo.yaml
  - notes-automation.yaml
  - notes-db.yaml
  - notes-dev.yaml
  - notes-helm.yaml
  - notes-images.yaml
  - notes.yaml
  - podinfo.yaml
  - receiver.yaml
  - registry.yaml
  - tenants.yaml
patches:
  - patch: |
      - op: add
        path: /spec/serviceAccountName
        value: kustomize-controller
    target:
      kind: Kustomization
      namespace: flux-system
