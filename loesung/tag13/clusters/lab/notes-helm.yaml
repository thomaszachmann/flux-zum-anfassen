---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notes-helm
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/notes-helm
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  timeout: 2m0s
  wait: true
