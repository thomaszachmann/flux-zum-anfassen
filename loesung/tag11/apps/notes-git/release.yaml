---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: notes
  namespace: notes-git
spec:
  chart:
    spec:
      chart: ./charts/notes
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 10m0s
  values:
    apiKey: lab-api-key-123
    nodePort: 30091
