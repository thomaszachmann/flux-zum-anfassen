---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: podinfo-helm
spec:
  chart:
    spec:
      chart: podinfo
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: podinfo
      version: 6.17.x
  interval: 10m0s
  values:
    replicaCount: 1
    ui:
      message: Hallo aus Flux
  driftDetection:
    mode: warn
